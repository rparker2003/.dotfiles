# ============================================================
# Hyprland Overrides
# Omarchy defaults I intentionally override
# PS The 💩 defaults: ~/.local/share/omarchy/default/hypr
# ============================================================

$scriptsDir = $HOME/.dotfiles/scripts


# ============================================================
# Window Management
# ============================================================

# Reserve SUPER + HJKL for Vim-style window navigation
#
# Omarchy defaults removed:
#   SUPER + J            Toggle window split
#   SUPER + K            Show key bindings
#   SUPER + L            Toggle workspace layout
#   SUPER SHIFT + HJKL   Window manipulation defaults
#
unbind = SUPER, H
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, L
unbind = SUPER SHIFT, H
unbind = SUPER SHIFT, J
unbind = SUPER SHIFT, K
unbind = SUPER SHIFT, L

# Focus windows
bind = SUPER, h, movefocus, l
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u
bind = SUPER, l, movefocus, r

# Move windows
bind = SUPER SHIFT, h, movewindow, l
bind = SUPER SHIFT, j, movewindow, d
bind = SUPER SHIFT, k, movewindow, u
bind = SUPER SHIFT, l, movewindow, r


# Resize windows
#
# Replaces Omarchy's -/= resize bindings with easier-to-reach
# Dactyl-friendly comma/period bindings
#
# Removed:
#   SUPER + -            Expand window left
#   SUPER + =            Shrink window left
#   SUPER SHIFT + -      Shrink window up
#   SUPER SHIFT + =      Expand window down
#
unbind = SUPER, code:20
unbind = SUPER, code:21
unbind = SUPER SHIFT, code:20
unbind = SUPER SHIFT, code:21
unbind = SUPER, comma
unbind = SUPER, period
unbind = SUPER SHIFT, comma
unbind = SUPER SHIFT, period

binde = SUPER, comma, resizeactive, -100 0        # shrink left/right dimension
binde = SUPER, period, resizeactive, 100 0        # grow left/right dimension
binde = SUPER SHIFT, comma, resizeactive, 0 -100  # shrink vertically
binde = SUPER SHIFT, period, resizeactive, 0 100  # grow vertically


# ============================================================
# Application Shortcuts
# ============================================================

# Reserve SUPER + Z for future use
unbind = SUPER, Z

# Jira + Zendesk search scripts
bind = SUPER SHIFT, J, exec, $scriptsDir/JiraSearch.sh
bind = SUPER SHIFT, Z, exec, $scriptsDir/ZendeskSearch.sh

# Remove alt from browser shortctu
unbind = SUPER SHIFT, B  # Browser
unbind = SUPER SHIFT ALT, B  # Browser
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, B, Browser (private), exec, omarchy-launch-browser --private


# File manager / window state
#
# Rebind:
#   SUPER SHIFT + F   Toggle floating
#   SUPER + T         File manager
#
unbind = SUPER SHIFT, F
unbind = SUPER ALT SHIFT, F
unbind = SUPER, T

bindd = SUPER SHIFT, F, Toggle window floating/tiling, togglefloating
bindd = SUPER, T, File manager, exec, uwsm-app -- nautilus --new-window

# File manager opened in current terminal directory
# bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"


# ============================================================
# Screenshots
# ============================================================

# Rebind screenshot tools to easier-to-reach keys
#
# SUPER SHIFT + S       Screenshot
# SUPER SHIFT CTRL + S  Extract text (OCR)
#
unbind = , PRINT
unbind = SUPER CTRL, PRINT

bindd = SUPER SHIFT, S, Screenshot, exec, omarchy-capture-screenshot
bindd = SUPER SHIFT CTRL, S, Extract text (OCR) from screenshot, exec, omarchy-capture-text-extraction


# ============================================================
# System Actions
# ============================================================

# Re-bind kill to SUPER + Q
unbind = SUPER, W
bindd = SUPER, Q, Close window, killactive


# Re-bind lock to CTRL ALT + L
unbind = SUPER CTRL, L
bindd = CTRL ALT, L, Lock system, exec, omarchy-system-lock


# Keep hardware power button as system menu
# Add keyboard shortcut:
#   CTRL ALT + P
#
bindld = , XF86PowerOff, System menu, exec, omarchy-menu system
bindd = CTRL ALT, P, System menu, exec, omarchy-menu system


# ============================================================
# Menus
# ============================================================

# Reclaim SUPER + / from monitor scaling
unbind = SUPER, code:61
unbind = SUPER ALT, code:61

bindd = SUPER, SLASH, Show key bindings, exec, omarchy-menu-keybindings


# Re-bind wallpaper/theme background menu to SUPER + W
unbind = SUPER CTRL, SPACE
bindd = SUPER, W, Theme background menu, exec, omarchy-menu background


# Re-bind Omarchy menu to SUPER + ESCAPE
unbind = SUPER ALT, SPACE
bindd = SUPER, ESCAPE, Omarchy menu, exec, omarchy-menu
